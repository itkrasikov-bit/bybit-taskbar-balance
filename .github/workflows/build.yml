name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore BybitTaskbar.csproj

      - name: Build
        run: dotnet build BybitTaskbar.csproj -c Release --no-restore

      - name: Publish (framework-dependent, win-x64)
        run: dotnet publish BybitTaskbar.csproj -c Release -r win-x64 --self-contained false -p:DebugType=none -o out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BybitTaskbar-win-x64
          path: out/**
